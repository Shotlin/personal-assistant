# Phase 1 local services.
# Task 1: PostgreSQL only (pgvector-capable image for future Phase 2 vector use).
# Task 7 extends this file with the pinned Open WebUI service.
services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: assistant
      POSTGRES_DB: assistant
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - assistant-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d assistant"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  assistant-postgres:
