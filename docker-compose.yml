# Phase 1 local services.
# Task 1: PostgreSQL (pgvector-capable image for future Phase 2 vector use).
# Task 7: pinned Open WebUI connected to the native agent gateway.
services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: assistant
      POSTGRES_DB: assistant
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - assistant-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d assistant"]
      interval: 5s
      timeout: 3s
      retries: 20

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.3
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Direct access moved to :3001 (debug/emergency only). Users reach
    # Open WebUI — and, same-origin, the Agent Designer — through the
    # designer-proxy on :3000.
    ports:
      - "127.0.0.1:3001:8080"
    volumes:
      - open-webui:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Loopback-only Phase 1: the UI is reachable at http://127.0.0.1:3000.
      ENABLE_FORWARD_USER_INFO_HEADERS: "true"
      # Token conservation (Phase 1.1): each of these fires a hidden model
      # request per message through the gateway. All disabled by owner
      # direction ("less, less, less token").
      ENABLE_TITLE_GENERATION: "false"
      ENABLE_TAGS_GENERATION: "false"
      ENABLE_FOLLOW_UP_GENERATION: "false"
      ENABLE_AUTOCOMPLETE_GENERATION: "false"
      # The pinned Open WebUI image connects to our gateway for the assistant model.
      OPENAI_API_BASE_URL: http://host.docker.internal:8787/v1
      OPENAI_API_KEY: ${AGENT_GATEWAY_API_KEY:-change-me}
      # Turn-lineage headers (X-OpenWebUI-Chat-Id etc.) are per-connection
      # custom headers in the Open WebUI DB, not environment variables in
      # v0.11.3. Apply them with:
      #   uv run python scripts/configure_openwebui_connection.py \
      #     --email <admin> --password <pass>

  # Same-origin reverse proxy: users live on http://127.0.0.1:3000 for
  # BOTH Open WebUI and the Agent Designer (/designer/* -> gateway). The
  # proxy injects the shell integration script into Open WebUI pages and
  # forwards the Open WebUI session so the gateway's SSO (Mode C) can
  # verify it server-side — no second login, no iframe, no port hop.
  designer-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - open-webui
    ports:
      - "127.0.0.1:3000:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DESIGNER_PROXY_KEY: ${DESIGNER_PROXY_KEY:-}
    volumes:
      - ./deploy/designer-proxy.nginx.conf.template:/etc/nginx/templates/default.conf.template:ro

volumes:
  assistant-postgres:
  open-webui:
