# Cua Driver capability manifest -- Phase 1 bounded runtime.
#
# Schema: cua-driver capability manifest version 3
# (https://cua.ai/docs/how-to-guides/driver/write-a-bounded-manifest).
# Pinned driver: cua-driver-rs v0.28.2 (deliberate selection, recorded;
# the stable channel moved past the spec's 0.28.1 reference).
#
# This is an APPLICATION-SCOPED manifest (generic desktop input). Per the
# Cua docs, typed-browser manifests are separate and cannot coexist with
# generic input tools; Phase 1 drives Chrome generically as an
# application, so no browser.origins section is declared here.
#
# Validation protocol (spec section 13.4): start the driver with this
# manifest in bounded mode, then run one allowed action (launch
# Calculator) and one intentionally denied action. Adjust only with the
# same review+test cycle.
#
# Allowlisted applications (bundle_id verified locally):
#   Calculator     com.apple.calculator
#   Google Chrome  com.google.Chrome
#   Terminal       com.apple.Terminal   (hosts Claude Code CLI)
#   TextEdit       com.apple.TextEdit   (reviewed 2026-09-24: the computer-
#       control acceptance test types a harmless phrase into a document, and
#       no other allowlisted app has a text field that a keystroke can be
#       independently verified against. Read/write is limited to whatever the
#       user opens; the driver still cannot touch any other application.)
version: 3
# A desktop assistant spends most of its life waiting for the user, and the
# driver enforces these two windows against wall-clock time rather than against
# activity. At the previous 8h/30m the policy silently locked itself after half
# an hour of thinking, and every call then failed with "capability manifest idle
# timeout exceeded" -- indistinguishable from a broken permission. Widened to a
# working day; the real fix is for Sani to re-approve the manifest when it goes
# stale, which is not yet implemented.
expires_after: 24h
idle_timeout: 12h
allow:
  tools:
    # session + inventory
    - start_session
    - end_session
    - set_agent_cursor_enabled
    - get_agent_cursor_state
    # WP3 (reviewed addition, 2026-09-17): motion physics only --
    # visibility timing (idle_hide_ms=0 during an active run), glide and
    # dwell. Session-scoped, controller-invoked only; never in the
    # model-visible tool inventory. No new application scope is granted.
    - set_agent_cursor_motion
    - list_apps
    - list_windows
    # controller diagnostics (reviewed 2026-09-24): read-only TCC probe of the
    # driver's own identity. Without it Sani can only report that a daemon
    # exists, and said "ready" while macOS refused to let that daemon move the
    # pointer. `prompt: false` never raises a dialog and grants nothing.
    - check_permissions
    # observation
    - get_window_state
    - get_desktop_state
    - get_screen_size
    - get_accessibility_tree
    - verify_state
    - zoom
    - bring_to_front
    # launch
    - launch_app
    # interaction
    - click
    - double_click
    - type_text
    - scroll
    - press_key
    - hotkey
    - set_value
resources:
  apps:
    - bundle_id: com.apple.calculator
      launch: true
      windows: all
      terminate: driver_launched
    - bundle_id: com.google.Chrome
      launch: true
      windows: all
      terminate: driver_launched
    - bundle_id: com.apple.Terminal
      launch: true
      windows: all
      terminate: driver_launched
    - bundle_id: com.apple.TextEdit
      launch: true
      windows: all
      terminate: driver_launched
  desktop:
    # v0.28.2 classifies list_apps/list_windows (Phase 1 required
    # observation, spec section 2.3) as desktop-display tools, so display
    # must be true. Input actions remain pid-bound to the allowlisted
    # apps above; reviewed 2026-09-17 with the allowed/denied test cycle.
    display: true
