<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sani — Setup</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0c0c0d;
        color: #f5f5f5;
        overflow: hidden;
      }
      /* Boot fallback: an opaque, visible card so a failed React mount is never
         a blank window. Hidden on announceReady(). */
      #boot-fallback {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: #0c0c0d;
        color: #f5f5f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
        font-size: 13px;
        letter-spacing: 0.01em;
      }
      #boot-fallback .bf-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #5b9bff;
        box-shadow: 0 0 0 4px rgba(91, 155, 255, 0.18);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-fallback"><span class="bf-dot"></span><span>Sani is preparing…</span></div>
    <script type="module" src="/src/app/onboarding-main.tsx"></script>
  </body>
</html>
