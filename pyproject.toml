[project]
name = "personal-assistant"
version = "0.1.0"
description = "Phase 1 core personal assistant: an OpenAI-compatible gateway over one LangChain Deep Agent with Cua computer control."
requires-python = ">=3.12,<3.13"
dependencies = [
    "deepagents==0.7.15",
    "langchain-openrouter==0.2.8",
    "langchain-openai>=1.6,<2",
    "langchain-mcp-adapters==0.3.2",
    "langgraph-checkpoint-postgres==3.1.2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic-settings>=2,<3",
    "psycopg[binary,pool]>=3.2,<4",
    "httpx>=0.28,<1",
    "orjson>=3.10,<4",
    "pyyaml>=6,<7",
    "langchain-typesafe==0.0.1a3",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "respx>=0.22,<1",
    "ruff>=0.9,<1",
    "mypy>=1.13,<2",
    "types-pyyaml>=6,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.per-file-ignores]
# The Phase 1 system prompt is verbatim spec text (section 11.4) and must not be re-wrapped.
"src/assistant/agent/system_prompt.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
